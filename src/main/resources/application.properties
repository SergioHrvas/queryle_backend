spring.application.name=queryle

# Comma-separated frontend origins allowed to call the API.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/queryle}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Initialize the PostgreSQL database from the classpath SQL scripts.
spring.sql.init.mode=always