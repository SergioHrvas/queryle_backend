spring.application.name=queryle

# Port
server.port=${PORT:8081}

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/queryle

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/queryle}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Initialize the PostgreSQL database from the classpath SQL scripts.
spring.sql.init.mode=always