services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: queryle-keycloak

    command: start-dev

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      - keycloak_data:/opt/keycloak/data

volumes:
  keycloak_data: